apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-minio-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-minio-test
  template:
    metadata:
      labels:
        app: nginx-minio-test
    spec:
      containers:
      - name: nginx-s3-gateway
        # 사내 레포에 올리신 이미지가 있다면 그 주소를 사용하세요
        image: nginxinc/nginx-s3-gateway:latest
        ports:
        - containerPort: 8080
        env:
        - name: S3_SERVER
          value: "minio-service.default.svc.cluster.local:9000"
        - name: S3_REGION
          value: "us-east-1"
        # 요청하신 경로 매핑 적용
        - name: S3_BUCKET
          value: "ic_pluto/unstructured"
        - name: S3_ACCESS_KEY
          value: "본인의_ACCESS_KEY"
        - name: S3_SECRET_KEY
          value: "본인의_SECRET_KEY"
        - name: S3_STYLE
          value: "path"
        # 인증 실패 시 원인을 파악하기 위해 true 설정
        - name: S3_DEBUG
          value: "true"