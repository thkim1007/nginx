apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-minio-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-minio-proxy
  template:
    metadata:
      labels:
        app: nginx-minio-proxy
    spec:
      containers:
      - name: nginx-s3-gateway
        image: nginxinc/nginx-s3-gateway:latest
        ports:
        - containerPort: 8080
        env:
        # 1. MinIO 연결 정보
        - name: S3_SERVER
          value: "minio-service.default.svc.cluster.local:9000"
        - name: S3_REGION
          value: "us-east-1" # MinIO 기본값
        - name: S3_BUCKET
          value: "your-image-bucket"
        
        # 2. Private 접근을 위한 자격 증명 (MinIO Access/Secret Key)
        - name: S3_ACCESS_KEY
          value: "minioadmin"
        - name: S3_SECRET_KEY
          value: "minioadmin"
        
        # 3. 추가 옵션
        - name: S3_STYLE
          value: "path" # Minio는 주로 path style(버킷명이 경로에 포함)을 사용
        - name: ALLOW_DIRECTORY_LIST
          value: "false" # 보안을 위해 디렉토리 목록 비활성화